[project]
name = "tablediff-cli"
authors = [
  {name = "Oleg Agapov", email="oleg.agapov.ua@gmail.com"}
]
description = "CLI tool for data diffing between two tables"
keywords = ["data diff", "table diff", "sql diff", "data diffing"]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
urls = {Homepage = "https://github.com/oleg-agapov/tablediff"}
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "rich",
  "reladiff",
  "duckdb"
]

[project.optional-dependencies]
mysql = [
  "reladiff[mysql]",
]
postgresql = [
  "reladiff[postgresql]",
]
snowflake = [
  "reladiff[snowflake]",
  "snowflake-connector-python[secure-local-storage]",
]
clickhouse = [
  "reladiff[clickhouse]",
]
presto = [
  "reladiff[presto]",
]
bigquery = [
  "google-cloud-bigquery",
]
oracle = [
  "reladiff[oracle]",
]
trino = [
  "reladiff[trino]",
]
vertica = [
  "reladiff[vertica]",
]
all = [
  "reladiff[all]",
  "snowflake-connector-python[secure-local-storage]",
]

dev = [
  "pytest",
  "pre-commit",
  "mypy",
  "ruff"
]

[project.readme]
file = "README.md"
content-type = "text/markdown"


[project.scripts]
tablediff = "tablediff.cli:main"

[build-system]
requires = ["setuptools >= 62.3.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tablediff*"]

[tool.setuptools.dynamic]
version = {attr = "tablediff.__version__"}

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "B017",  # Allow pytest.raises(Exception) in tests
    "UP038",  # Allow isinstance with tuple of types (older Python style)
]

[tool.ruff.lint.isort]
known-first-party = ["tablediff"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true
